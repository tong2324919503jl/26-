<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780">
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3f7773"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.4" markerHeight="3.4" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#934f52"/>
    </marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #283238; }
      .label { font-size: 22px; }
      .small { font-size: 19px; }
      .tiny { font-size: 17px; }
      .legendText { font-size: 15px; }
      .legendText .small { font-size: 15px; }
      .legendText .label { font-size: 17px; }
    </style>
  </defs>

  <rect width="1200" height="780" fill="#f7f7f5"/>

  <!-- 放大几何主体，压缩图例在整图中的占比 -->
  <g transform="translate(-112,-95) scale(1.34)">

  <!-- 两条观测条带 -->
  <polygon points="115,250 950,250 950,350 115,350" fill="#a9bac4" fill-opacity="0.34" stroke="#718793" stroke-width="2"/>
  <polygon points="386,180 414,140 814,420 786,460" fill="#b7a99c" fill-opacity="0.34" stroke="#8d7b6d" stroke-width="2"/>

  <!-- 两条中心线 -->
  <line x1="115" y1="300" x2="950" y2="300" stroke="#536d78" stroke-width="3" stroke-dasharray="10 8"/>
  <line x1="400" y1="160" x2="800" y2="440" stroke="#77695f" stroke-width="3" stroke-dasharray="10 8"/>

  <!-- 严格由边界交点确定的平行四边形交集 -->
  <polygon points="486,250 571,250 714,350 629,350" fill="#8f8793" fill-opacity="0.55" stroke="#665d69" stroke-width="2.5"/>

  <!-- 半宽 w1：端点接触中心线与边界 -->
  <line x1="300" y1="250" x2="300" y2="300" stroke="#3f7773" stroke-width="3" marker-start="url(#arrow-teal)" marker-end="url(#arrow-teal)"/>
  <text x="314" y="278" class="label" fill="#3f7773">w₁</text>

  <!-- 半宽 w2：垂直于第二条中心线，端点接触边界 -->
  <line x1="686" y1="390" x2="714" y2="350" stroke="#3f7773" stroke-width="3" marker-start="url(#arrow-teal)" marker-end="url(#arrow-teal)"/>
  <text x="718" y="389" class="label" fill="#3f7773">w₂</text>

  <!-- 外包直径：端点均位于交集边界顶点 -->
  <line x1="486" y1="250" x2="714" y2="350" stroke="#934f52" stroke-width="3" marker-start="url(#arrow-red)" marker-end="url(#arrow-red)"/>

  <!-- 中心线交点与 beta_0 角弧置于最上层；标注移至弧线外侧 -->
  <circle cx="600" cy="300" r="5" fill="#283238"/>
  <path d="M600 300 L665 300 A65 65 0 0 1 654 336" fill="none" stroke="#20282b" stroke-width="3"/>
  <text x="678" y="321" class="label" font-style="italic">β₀</text>
  <text x="610" y="290" class="small">O</text>

  </g>

  <!-- 图例 -->
  <g class="legendText">
  <rect x="90" y="582" width="1020" height="96" rx="8" fill="#ffffff" fill-opacity="0.80" stroke="#c5c8c7" stroke-width="1.5"/>
  <text x="120" y="603" class="small" font-weight="600">图例</text>

  <rect x="120" y="612" width="22" height="13" fill="#a9bac4" fill-opacity="0.50" stroke="#718793" stroke-width="1.5"/>
  <text x="156" y="623" class="small">首站观测条带</text>
  <rect x="345" y="612" width="22" height="13" fill="#b7a99c" fill-opacity="0.50" stroke="#8d7b6d" stroke-width="1.5"/>
  <text x="381" y="623" class="small">第二站观测条带</text>
  <rect x="605" y="612" width="22" height="13" fill="#8f8793" fill-opacity="0.60" stroke="#665d69" stroke-width="1.5"/>
  <text x="641" y="623" class="small">两条带的真实交集</text>

  <line x1="120" y1="642" x2="148" y2="642" stroke="#3f7773" stroke-width="3" marker-start="url(#arrow-teal)" marker-end="url(#arrow-teal)"/>
  <text x="165" y="649" class="small">半宽 w₁ 或 w₂：中心线到对应条带边界的垂直距离</text>
  <line x1="650" y1="642" x2="678" y2="642" stroke="#934f52" stroke-width="3" marker-start="url(#arrow-red)" marker-end="url(#arrow-red)"/>
  <text x="695" y="649" class="small">外包直径：交集平行四边形两个顶点间的距离</text>

  <path d="M120 660 L145 660 A25 25 0 0 1 140 675" fill="none" stroke="#20282b" stroke-width="2.5"/>
  <text x="165" y="672" class="small">β₀：两条中心线交点处的锐角</text>
  <line x1="650" y1="660" x2="710" y2="660" stroke="#536d78" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="725" y="667" class="small">虚线：观测中心线</text>
  </g>
</svg>
